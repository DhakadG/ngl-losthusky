<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ff2e74" />
<title>losthusky</title>
<style>
  :root{
    --pink:#ff2e74; --orange:#ff9a3c; --purple:#7c3aed;
    --grad:linear-gradient(105deg,#ff2e74 0%,#ff6a3d 55%,#ff9a3c 100%);
    --ink:#12131a; --muted:#7a7f8c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
    min-height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px 16px; gap:16px;
    background:linear-gradient(160deg,#ff2e74 0%,#ff6a3d 48%,#ffb03a 100%);
    background-attachment:fixed;
  }
  .card{
    width:100%; max-width:420px; background:#fff; border-radius:30px;
    padding:30px 24px 24px; text-align:center;
    box-shadow:0 30px 70px rgba(120,20,60,.35);
  }
  .avatar{
    width:92px;height:92px;margin:0 auto 12px;border-radius:50%;
    background:var(--grad); display:grid; place-items:center; font-size:44px;
    box-shadow:0 10px 24px rgba(255,46,116,.45);
  }
  .handle{font-size:21px;font-weight:800;color:var(--ink);margin-bottom:4px}
  .subtitle{font-size:13px;color:var(--muted);margin-bottom:20px}
  form{display:flex;flex-direction:column}
  .prompt{
    font-size:23px;font-weight:800;color:#fff;line-height:1.25;
    background:var(--grad); border-radius:22px 22px 0 0; padding:22px 18px 40px;
    word-break:break-word;
  }
  textarea{
    margin:-26px 10px 0; border:none; border-radius:18px; resize:none; min-height:104px;
    background:#f1f2f6; padding:16px; font-size:16px; color:var(--ink); font-family:inherit;
    outline:3px solid transparent; transition:outline-color .15s, background .15s;
    box-shadow:0 6px 18px rgba(0,0,0,.06);
  }
  textarea::placeholder{color:#9aa0ac}
  textarea:focus{outline-color:rgba(255,46,116,.5);background:#fff}
  .handle-wrap{
    margin:12px 10px 0; display:flex; align-items:center; gap:7px;
    background:#f1f2f6; border-radius:14px; padding:0 6px 0 13px;
    outline:2px solid transparent; transition:outline-color .15s, background .15s;
  }
  .handle-wrap:focus-within{outline-color:rgba(255,46,116,.4); background:#fff}
  .ig-icon{flex:0 0 auto; display:flex; line-height:0}
  .handle-wrap .at{color:#9aa0ac; font-weight:700; font-size:14px}
  .handle-field{
    flex:1; min-width:0; margin:0; border:none;border-radius:0;background:transparent;
    padding:13px 10px 13px 0;font-size:14px;color:var(--ink);outline:none;font-family:inherit;
  }
  .send-btn{
    margin:16px 10px 0; border:none;border-radius:18px;background:var(--grad);color:#fff;
    font-size:18px;font-weight:800;padding:16px;cursor:pointer;
    box-shadow:0 12px 24px rgba(255,74,60,.4);transition:transform .1s,opacity .2s;
  }
  .send-btn:active{transform:scale(.97)}
  .send-btn:disabled{opacity:.6}
  .sent-state{display:flex;flex-direction:column;align-items:center;gap:14px;padding:26px 0}
  .sent-state .check{
    width:76px;height:76px;border-radius:50%;background:var(--grad);color:#fff;
    font-size:40px;display:grid;place-items:center;box-shadow:0 10px 24px rgba(255,46,116,.4)
  }
  .sent-state p{font-size:20px;font-weight:800;color:var(--ink)}
  .secondary{
    border:2px solid var(--pink);background:#fff;color:var(--pink);
    border-radius:16px;padding:13px 26px;font-weight:800;cursor:pointer;font-size:15px
  }
  .disclosure{
    margin:20px 8px 4px;font-size:11.5px;line-height:1.55;color:#8a5a2a;
    background:#fff6ec;border:1px solid #ffd9ab;border-radius:14px;padding:11px 13px;text-align:left
  }
  .brand{color:rgba(255,255,255,.9);font-weight:800;letter-spacing:.5px;font-size:15px;text-shadow:0 1px 4px rgba(0,0,0,.15)}
  .brand small{display:block;font-weight:600;font-size:11px;opacity:.85;letter-spacing:2px;margin-top:2px}
  .admin-dot{position:fixed;bottom:10px;right:12px;color:rgba(255,255,255,.35);text-decoration:none;font-size:18px}
  .hidden{display:none!important}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:#12131a;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,.3)
  }
</style>
</head>
<body>
  <main class="card">
    <div class="avatar" id="avatar">🐺</div>
    <div class="handle" id="handle">@losthusky</div>
    <div class="subtitle">drop a message 👇</div>

    <form id="sendForm">
      <div class="prompt" id="prompt">send me a message!</div>
      <textarea id="message" maxlength="1000" placeholder="send me a message... 👀" required></textarea>
      <div class="handle-wrap">
        <span class="ig-icon" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 24 24">
            <defs>
              <linearGradient id="igg" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#ffdb73"/>
                <stop offset=".25" stop-color="#fa7e1e"/>
                <stop offset=".5" stop-color="#d62976"/>
                <stop offset=".75" stop-color="#962fbf"/>
                <stop offset="1" stop-color="#4f5bd5"/>
              </linearGradient>
            </defs>
            <rect x="1.5" y="1.5" width="21" height="21" rx="6.5" fill="url(#igg)"/>
            <circle cx="12" cy="12" r="5.2" fill="none" stroke="#fff" stroke-width="1.7"/>
            <circle cx="17.6" cy="6.4" r="1.15" fill="#fff"/>
          </svg>
        </span>
        <span class="at">@</span>
        <input id="handleField" class="handle-field" type="text" maxlength="60"
          placeholder="yourhandle (optional)" autocomplete="off" />
      </div>
      <button type="submit" id="sendBtn" class="send-btn">Send!</button>
    </form>

    <div id="sentState" class="sent-state hidden">
      <div class="check">✓</div>
      <p>Sent! 🎉</p>
      <button class="secondary" id="againBtn">Send another</button>
    </div>

    <p class="disclosure">
      ⚠️ <b>Not anonymous.</b> The person receiving this can see your approximate
      location, device, browser and network provider for each message you send.
    </p>
  </main>

  <div class="brand">losthusky<small>Q &amp; A</small></div>
  <a href="/admin" class="admin-dot" aria-label="dashboard">·</a>

  <script src="/app.js"></script>
</body>
</html>
